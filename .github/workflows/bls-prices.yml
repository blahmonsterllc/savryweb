name: Monthly grocery prices

# BLS publishes average retail prices with the CPI, around the middle of each
# month. This refreshes content/cost/food-prices.json from them and commits the
# change, which redeploys the site; /api/cron/recost then re-prices every
# recipe the next day, and the app downloads the new table from
# /api/prices/table. No database key lives in GitHub.

on:
  schedule:
    - cron: '0 14 16 * *'
  workflow_dispatch:
    inputs:
      check_push:
        description: 'Only check that this workflow can push (creates and deletes a throwaway branch)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh from BLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The write token is not left on disk for npm install scripts or tests; only the push steps use it.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - name: Check that this workflow can push
        if: inputs.check_push
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="bls-push-check-${GITHUB_RUN_ID}"
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" "HEAD:refs/heads/${branch}"
          git push "$remote" --delete "${branch}"
          echo "push permission confirmed"
      - run: npm ci
        if: ${{ !inputs.check_push }}
      - name: Pull the latest BLS average prices
        if: ${{ !inputs.check_push }}
        run: node scripts/cost/refresh-bls.mjs
        env:
          # Optional: a free key from data.bls.gov/registrationEngine raises the daily limit shared runners can hit.
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      - name: Anything new?
        if: ${{ !inputs.check_push }}
        id: diff
        run: |
          if git diff --quiet -- content/cost/food-prices.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Tests, type check and build before committing
        if: steps.diff.outputs.changed == 'true'
        run: |
          node --test tests/*.test.mjs
          npx tsc --noEmit -p .
          npm run build
        env:
          # Public values only, the same ones ci.yml builds with: commits pushed by this workflow do not trigger ci.yml.
          NEXT_PUBLIC_SUPABASE_URL: https://qnpekzrchqftdoaebzuf.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_3lpt2dqF_B0B2V4YP8RZiQ_2IOpz5Am
          NEXT_PUBLIC_SITE_URL: https://www.savry.io
      - name: Commit the new prices
        if: steps.diff.outputs.changed == 'true'
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "savry-prices-bot"
          git config user.email "savry-prices-bot@users.noreply.github.com"
          period=$(node -e "console.log(require('./content/cost/food-prices.json').asOf)")
          git add content/cost/food-prices.json
          git commit -m "Grocery prices from BLS, ${period}"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
